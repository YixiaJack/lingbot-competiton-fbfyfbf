<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>现场作战台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2128;--muted:#6b7380;--border:#e3e6eb;--chip:#eef1f5;--hl:#e8edf7;
--cur:#2f6fdb;--ok:#1f9d55;--warn:#b7791f;--err:#d64545;--grid:#dfe3e9;--track:#e6e9ee;--heat:47,111,219;--sug:214,69,69}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--fg:#e7e9ee;--muted:#9097a3;--border:#2b2f37;
--chip:#262a31;--hl:#232a36;--cur:#5b93f0;--ok:#3cc47c;--warn:#e0a84a;--err:#f06a6a;--grid:#2f343d;--track:#2b2f37;
--heat:91,147,240;--sug:240,106,106}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif}
.num,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1180px;margin:0 auto}
.top h1{font-size:16px;margin:0;font-weight:650}
.top a{color:var(--muted);text-decoration:none;font-size:13px}
.top .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1180px;margin:0 auto}
nav button{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--chip);color:var(--fg);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:650}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--muted);font-weight:600}
.big{font-size:26px;font-weight:650;line-height:1.15}
.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--cur);border-color:var(--cur);color:#fff}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin:1px 3px 1px 0}
.tag.err{background:rgba(214,69,69,.13);color:var(--err)}.tag.warn{background:rgba(183,121,31,.14);color:var(--warn)}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.map{position:relative;border-radius:8px;overflow:hidden;background:var(--track)}
.map img{display:block;width:100%;height:auto}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.bars .row{display:grid;grid-template-columns:7.5em 1fr 2.6em;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.bars .track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--cur);border-radius:4px}
.bars .row.low .fill{background:var(--warn)}.bars .row.zero .lab{color:var(--err)}
.bars .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug{border:1.5px solid rgb(var(--sug));border-radius:10px;padding:12px;background:rgba(var(--sug),.06)}
.sug .what{font-size:16px;font-weight:650;margin:2px 0 4px}
button.act{border:1px solid var(--border);background:var(--chip);color:var(--fg);border-radius:7px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:var(--hl)}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.drawer.on{display:flex}
.drawer .card{max-width:560px;width:100%}
.kv{display:grid;grid-template-columns:6.5em 1fr;gap:3px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.trial{display:grid;grid-template-columns:2.2em repeat(6,minmax(0,1fr)) 3.2em;gap:4px;align-items:center;font-size:12px;margin:2px 0}
.trial label{display:flex;justify-content:center}
.trial.h{color:var(--muted)}
input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--fg);width:100%}
.note{font-size:12px;color:var(--muted);margin-top:8px}
ul.clean{margin:4px 0;padding-left:18px}
table.mat td,table.mat th{padding:3px 6px;font-size:12px}
details summary{margin-top:8px}
.sticky-note{font-size:12px;color:var(--muted);padding:6px 16px;max-width:1180px;margin:0 auto}
.episode-preview{width:96px;height:54px;object-fit:cover;border-radius:5px;background:var(--track)}
.data-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.data-toolbar form{display:flex;gap:6px;flex:1;min-width:220px}
.data-toolbar input{min-width:0}.data-toolbar button{white-space:nowrap}
.data-table td.prompt{min-width:250px;max-width:520px}.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
</style>
</head>

  var t=ev.target.closest("[data-task]");if(t){S.task=+t.getAttribute("data-task");S.sug=0;S.page=0;S.posCell=null;S.posObject="all";render();return}
  var po=ev.target.closest("[data-pos-origin]");if(po){S.posOrigin=po.getAttribute("data-pos-origin");S.posCell=null;render();return}
  var pl=ev.target.closest("[data-pos-layer]");if(pl){S.posLayer=pl.getAttribute("data-pos-layer");S.posCell=null;render();return}
  var pc=ev.target.closest("[data-pos-cell]");if(pc){S.posCell=+pc.getAttribute("data-pos-cell");render();return}
  var o=ev.target.closest("[data-origin]");if(o){S.origin=o.getAttribute("data-origin");S.page=0;render();return}
  var pg=ev.target.closest("[data-page]");if(pg){S.page=+pg.getAttribute("data-page");render();return}
  if(ev.target.closest("[data-next-plan]")){nextCollectionPlan(S.task);render();return}
  if(ev.target.closest("[data-copy-prompt]")){copyPlan();return}
  var pm=ev.target.closest('[data-plan-mode]');if(pm){setPlanMode(S.task,pm.getAttribute('data-plan-mode'));render();return}
  if(ev.target.closest('[data-copy-setup]')){copySetup();return}
  var l=ev.target.closest("[data-layer]");if(l){S.layer=l.getAttribute("data-layer");render();return}
  var e=ev.target.closest("[data-ep]");if(e){openEp(+e.getAttribute("data-ep"));return}
  if(ev.target.id==="drawer"||ev.target.closest("[data-close]")){el("drawer").classList.remove("on");return}
  if(ev.target.closest("[data-resug]")){S.sug++;render();return}
  if(ev.target.closest("[data-onlybad]")){S.onlyBad=!S.onlyBad;render();return}
});

function byTask(t){return S.data.episodes.filter(function(e){return e.task===t})}
function W(){return (S.data.image_size||[320,240])[0]}function H(){return (S.data.image_size||[320,240])[1]}
function mapPoint(e,p){var size=e.image_size||[W(),H()];return p?[p[0]*W()/size[0],p[1]*H()/size[1]]:null}
function cellOf(p){return [Math.min(COLS-1,Math.max(0,Math.floor(p[0]/W()*COLS))),Math.min(ROWS-1,Math.max(0,Math.floor(p[1]/H()*ROWS)))]}
function cellName(c){return "第 "+(c[1]+1)+" 行第 "+(c[0]+1)+" 列"}

function coverage(t){
  var X=byTask(t),cnt=[],reg=[],r,c;
  for(r=0;r<ROWS;r++){cnt.push(new Array(COLS).fill(0));reg.push(new Array(COLS).fill(false))}
  X.forEach(function(e){
    (e.dets||[]).forEach(function(d){var p=cellOf(mapPoint(e,ctr(d.slice(1,5))));reg[p[1]][p[0]]=true});
    var pts=t===3?(e.balls||[]).map(function(b){return mapPoint(e,ctr(b))}):(e.tc?[e.tc]:[]);
    pts.forEach(function(p){var q=cellOf(p);cnt[q[1]][q[0]]++})});
  var vals=[];for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(reg[r][c])vals.push(cnt[r][c]);
  var mean=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:0,low=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(reg[r][c]&&cnt[r][c]<Math.max(1,0.5*mean))low.push([c,r,cnt[r][c]]);
  low.sort(function(a,b){return a[2]-b[2]});
  var covered=vals.filter(function(v){return v>0}).length;
  return {cnt:cnt,reg:reg,mean:mean,low:low,covered:covered,cells:vals.length,max:Math.max.apply(null,[1].concat(vals))}}

function counts(keys,vals){var m={};keys.forEach(function(k){m[k]=0});vals.forEach(function(v){if(v!=null)m[v]=(m[v]||0)+1});return m}
function bars(m,label,opt){opt=opt||{};var ks=Object.keys(m);if(opt.sort)ks.sort(function(a,b){return m[a]-m[b]});
  var mx=Math.max.apply(null,[1].concat(ks.map(function(k){return m[k]}))),mean=ks.length?ks.reduce(function(a,k){return a+m[k]},0)/ks.length:0;
  return '<div class="bars">'+ks.map(function(k){var v=m[k],cls=v===0?"zero low":v<0.6*mean?"low":"";
    return '<div class="row '+cls+'"><div class="lab" title="'+esc(label(k))+'">'+esc(label(k))+'</div><div class="track"><div class="fill" style="width:'+(100*v/mx)+'%"></div></div><div class="num">'+v+'</div></div>'}).join("")+'</div>'}

function suggestion(t){
  var X=byTask(t),cv=coverage(t),objs=t===1?T1_OBJ:T2_OBJ,dests=t===1?COLORS:LEVELS;
  if(t===3){var c3=cv.low[S.sug%Math.max(1,cv.low.length)];return {text:"纸团放在"+(c3?cellName([c3[0],c3[1]]):"覆盖最少的区域"),cell:c3,why:"任务 3 只看纸团位置的覆盖"}}
  var oc=counts(objs,X.map(function(e){return e.target})),combo={};
  X.forEach(function(e){var k=e.target+"|"+e.dest;combo[k]=(combo[k]||0)+1});
  var order=objs.slice().sort(function(a,b){return oc[a]-oc[b]||objs.indexOf(a)-objs.indexOf(b)});
  var o=order[S.sug%order.length];
  var dd=dests.slice().sort(function(a,b){return (combo[o+"|"+a]||0)-(combo[o+"|"+b]||0)});
  var dc=counts(dests,X.map(function(e){return e.dest}));
  var d=dd.filter(function(x){return (combo[o+"|"+x]||0)===(combo[o+"|"+dd[0]]||0)}).sort(function(a,b){return dc[a]-dc[b]})[0];
  var cell=cv.low.length?cv.low[S.sug%cv.low.length]:null;
  var tl=TEMPL[t],tc=counts([0,1,2,3,4],X.map(function(e){return e.tmpl})),ti=[0,1,2,3,4].sort(function(a,b){return tc[a]-tc[b]})[0];
  return {text:"目标 "+zh(o)+" → "+(t===1?COLOR_ZH[d]+"盘":LEVEL_ZH[d]),cell:cell,o:o,d:d,
    why:zh(o)+" 目前 "+oc[o]+" 条；这个组合 "+(combo[o+"|"+d]||0)+" 条"+(cell?"；目标放在"+cellName([cell[0],cell[1]])+"（地图上红框，现有 "+cell[2]+" 条）":"")+"；指令用第 "+(ti+1)+" 种说法（"+tl[ti]+" …，现有 "+tc[ti]+" 条）"}}

function mapSvg(t,cv,sug){
  var X=byTask(t),w=W(),h=H(),cw=w/COLS,ch=h/ROWS,s=[],r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(!cv.reg[r][c])continue;var v=cv.cnt[r][c];
    s.push('<rect x="'+c*cw+'" y="'+r*ch+'" width="'+cw+'" height="'+ch+'" style="fill:rgba(var(--heat),'+(0.08+0.5*v/cv.max).toFixed(3)+')" stroke="rgba(255,255,255,.35)" stroke-width="0.5"/>');
    if(v<Math.max(1,0.5*cv.mean))s.push('<rect x="'+(c*cw+1)+'" y="'+(r*ch+1)+'" width="'+(cw-2)+'" height="'+(ch-2)+'" fill="none" stroke="#e0a84a" stroke-width="1.2" stroke-dasharray="3 2"/>');
    s.push('<text x="'+(c*cw+3)+'" y="'+(r*ch+10)+'" font-size="8" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2px">'+v+'</text>')}
  if(sug&&sug.cell)s.push('<rect x="'+(sug.cell[0]*cw+1)+'" y="'+(sug.cell[1]*ch+1)+'" width="'+(cw-2)+'" height="'+(ch-2)+'" fill="none" style="stroke:rgb(var(--sug))" stroke-width="2.2"/>');
  X.forEach(function(e){
    if(S.layer!=="dest"){var pts=t===3?(e.balls||[]).map(function(b){return mapPoint(e,ctr(b))}):(e.tc?[e.tc]:[]);
      pts.forEach(function(p){s.push('<circle data-ep="'+e.n+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#fff" stroke="#111" stroke-width="1" style="cursor:pointer"><title>#'+e.n+' '+esc(zh(e.target))+'</title></circle>')})}
    if(S.layer!=="target"&&e.dc){var col=t===1?(PLATE_RGB[e.dest]||"#999"):"#9aa3b2";
      s.push('<rect data-ep="'+e.n+'" x="'+(e.dc[0]-3.5)+'" y="'+(e.dc[1]-3.5)+'" width="7" height="7" fill="'+col+'" stroke="#111" stroke-width="1" style="cursor:pointer"><title>#'+e.n+' '+esc(t===1?COLOR_ZH[e.dest]+"盘":LEVEL_ZH[e.dest]||"")+'</title></rect>')}
    if(S.layer==="all")(e.dets||[]).forEach(function(d){var p=mapPoint(e,ctr(d.slice(1,5)));s.push('<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.6" fill="rgba(255,255,255,.7)"/>')})});
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+s.join("")+'</svg>'}

function imageUrl(name){return '/api/field-img?f='+encodeURIComponent(name)+'&v='+encodeURIComponent(S.data.generated||'')}
function visualPending(){return S.data.outcome_status==="not_evaluated"||!!(S.data.detector&&S.data.detector.status==="not_evaluated")}
function originName(e){return e.origin==="public"?"官方公共真机":e.origin==="private"?"现场自采":e.collector||e.source||"未标明"}
function annotationText(e){var text=e.annotation_quality!=null&&e.annotation_quality!==""?String(e.annotation_quality):e.annotation_score!=null?"评分 "+e.annotation_score:"未标注";return text+(e.annotation_result?' · '+e.annotation_result:'')}
function realRows(){var q=S.query.toLowerCase();return S.data.episodes.filter(function(e){return e.data_kind==="real"&&e.task===S.task&&(S.origin==="all"||e.origin===S.origin)&&(!q||[e.record_id,e.instruction,e.target,zh(e.target),e.collector,e.ds].join(" ").toLowerCase().indexOf(q)>=0)})}
function weightedTemplate(templates,random){var total=templates.reduce(function(n,t){return n+t.weight},0),x=(random==null?Math.random():random)*total;for(var i=0;i<templates.length;i++){x-=templates[i].weight;if(x<0)return templates[i]}return templates[templates.length-1]}
function planningPhrases(task,spec){return Object.assign({},task===2?T2_MISSING_PHRASES:{},spec.object_phrases)}
function targetCounts(task,rows){return counts(task===1?T1_OBJ:task===2?T2_OBJ:[],rows.map(function(e){return e.target}))}
function planMode(task){
  if(task===3)return 'coverage';
  if(!S.planModes)S.planModes=lsGet('field_plan_modes_v1',{});
  return S.planModes&&S.planModes[task]==='coverage'?'coverage':'evaluation';
}
function setPlanMode(task,mode){
  if(task===3||['coverage','evaluation'].indexOf(mode)<0)return;
  planMode(task);S.planModes[task]=mode;lsSet('field_plan_modes_v1',S.planModes);
  if(S.plans)delete S.plans[task];
}
function evalSceneFilter(task){
  if(!S.evalSceneFilters)S.evalSceneFilters=lsGet('field_eval_scene_filters_v1',{});
  var value=String((S.evalSceneFilters||{})[task]||'auto');
  return (EVAL_SCENES[task]||[]).some(function(s){return String(s.id)===value})?value:'auto';
}
function setEvalScene(task,value){
  evalSceneFilter(task);S.evalSceneFilters[task]=String(value);lsSet('field_eval_scene_filters_v1',S.evalSceneFilters);
  if(S.plans)delete S.plans[task];
}
function evaluationHistory(task){
  if(!S.evalHistory)S.evalHistory=lsGet('field_eval_history_v1',{tasks:{}});
  if(!S.evalHistory||!S.evalHistory.tasks)S.evalHistory={tasks:{}};
  var h=S.evalHistory.tasks[task];
  if(!h||!Array.isArray(h.seen))h=S.evalHistory.tasks[task]={seen:[],used:{},visits:{},lastKey:null,lastPrompt:null};
  return h;
}
function planningHistory(task){
  if(!S.planHistory)S.planHistory=lsGet('field_plan_history_v1',null);
  if(!S.planHistory||S.planHistory.version!==1||!S.planHistory.tasks||typeof S.planHistory.tasks!=='object')S.planHistory={version:1,tasks:{}};
  var h=S.planHistory.tasks[task];
  if(!h||!Array.isArray(h.used))h=S.planHistory.tasks[task]={used:[],step:0,lastKey:null,lastPrompt:null};
  return h;
}
function planningContext(task,spec){
  var all=byTask(task).filter(function(e){return e.data_kind==='real'}),own=all.filter(function(e){return e.origin==='private'}),coverage={};
  all.forEach(function(e){var key=JSON.stringify([e.origin,e.target,e.dest]);coverage[key]=(coverage[key]||0)+1});
  // Only changes relevant to this task restart its rotation. A new export time,
  // image estimate, or another task's uploads must not consume its suggestions.
  return {all:all,own:own,revision:JSON.stringify([spec,Object.keys(coverage).sort().map(function(k){return [k,coverage[k]]})])};
}
function nextCollectionPlan(task){S.plans=S.plans||{};delete S.plans[task];return collectionPlan(task)}
function collectionPlan(task){
  return planMode(task)==='evaluation'?evaluationPlan(task):coveragePlan(task);
}
function coveragePlan(task){
  var spec=S.data.prompt_policy&&S.data.prompt_policy.tasks[String(task)];if(!spec)return null;
  var context=planningContext(task,spec),own=context.own,all=context.all;
  S.plans=S.plans||{};var old=S.plans[task];if(old&&old.mode==='coverage'&&old.revision===context.revision)return old;
  var history=planningHistory(task),plan={task:task,mode:'coverage',generated:S.data.generated,revision:context.revision,
    basis:{private_episodes:own.length,public_episodes:all.filter(function(e){return e.origin==='public'}).length,total_episodes:all.length}};
  if(history.revision!==context.revision){history.used=[];history.revision=context.revision}
  if(task===3){
    plan.title='双臂清扫：纸团 → 簸箕 → 收纳筐';
    plan.setup=['纸团分散摆放，左右两侧都覆盖。','纸团适度聚集，留出扫把与簸箕协作空间。','纸团靠近工作区边缘，保持机器人安全可达。'][((history.step||0)+own.length)%3];
    plan.action='按提示词扫净桌面，将纸团全部倒入筐；放下两个工具，双臂归位并静止。';
    plan.reason='任务三按官方权重抽取完整提示词，避开上一条相同提示词，并轮换纸团摆放建议。保留清扫、倒入、放工具和归位要求；摆放建议尚未根据图像计算空间覆盖。';
  }else{
    var phrases=planningPhrases(task,spec),combos=[];Object.keys(phrases).forEach(function(o){spec.destinations.forEach(function(d){combos.push({o:o,d:d,key:o+'|'+d,own:own.filter(function(e){return e.target===o&&e.dest===d}).length,total:all.filter(function(e){return e.target===o&&e.dest===d}).length})})});
    if(!combos.length)return null;
    history.used=history.used.filter(function(key){return combos.some(function(c){return c.key===key})});
    var remaining=combos.filter(function(c){return history.used.indexOf(c.key)<0});
    if(!remaining.length){history.used=[];remaining=combos.slice()}
    // Rotate through every combination before repeating, including a uniquely
    // smallest gap. Shown suggestions are never added to actual episode counts.
    var different=remaining.filter(function(c){return c.key!==history.lastKey});if(different.length)remaining=different;
    remaining.sort(function(a,b){return a.own-b.own||a.total-b.total});
    var ties=remaining.filter(function(c){return c.own===remaining[0].own&&c.total===remaining[0].total}),c=ties[Math.floor(Math.random()*ties.length)];
    plan.object=c.o;plan.destination=c.d;
    plan.title=zh(c.o)+' → '+(task===1?COLOR_ZH[c.d]+'盘':LEVEL_ZH[c.d]);
    plan.setup='摆好'+zh(c.o)+'和'+(task===1?COLOR_ZH[c.d]+'色盘子':'收纳盒')+'，加入其他物体作为干扰；变换目标位置和朝向，保持安全可达。';
    plan.action='确认目标与提示词一致，完成抓取、运输、放置、松手和归位；不要中途改换物体或目标位置。';
    plan.reason='在本轮尚未推荐的组合里优先补自采缺口（第 '+(history.used.length+1)+' / '+combos.length+' 条建议）：该组合已接入自采 '+c.own+' 条、全部真机 '+c.total+' 条。句式独立按官方频率抽取。';
    if(!spec.object_phrases[c.o])plan.reason+=' 官方样例没有该物体作为目标的记录；物体描述取自赛题物品清单。';
    history.used.push(c.key);history.lastKey=c.key;
  }
  function promptFor(template){return task===3?template.text:template.text.replace('{object}',phrases[plan.object]).replace('{destination}',plan.destination)}
  var eligible=spec.templates.filter(function(t){return promptFor(t)!==history.lastPrompt});
  if(!eligible.length)eligible=spec.templates;
  var template=weightedTemplate(eligible);plan.template=template.id;plan.prompt=promptFor(template);
  plan.probability=template.weight/eligible.reduce(function(n,t){return n+t.weight},0);
  history.lastPrompt=plan.prompt;history.step=(history.step||0)+1;
  lsSet('field_plan_history_v1',S.planHistory);
  S.plans[task]=plan;return plan;
}
function evaluationPlan(task){
  var spec=S.data.prompt_policy&&S.data.prompt_policy.tasks[String(task)];if(!spec)return null;
  var context=planningContext(task,spec),filter=evalSceneFilter(task),scenes=EVAL_SCENES[task];
  var revision=JSON.stringify([context.revision,scenes,filter]),history=evaluationHistory(task);
  S.plans=S.plans||{};var old=S.plans[task];if(old&&old.mode==='evaluation'&&old.revision===revision)return old;
  if(history.revision!==context.revision){history.used={};history.revision=context.revision}
  var remaining=scenes.filter(function(s){return history.seen.indexOf(s.id)<0});
  if(!remaining.length){history.seen=[];remaining=scenes.slice()}
  var scene=filter==='auto'?remaining[0]:scenes.find(function(s){return String(s.id)===filter});
  var visit=history.visits[scene.id]||0;
  var phrases=Object.assign({},task===1?EVAL_EXTRA_PHRASES:{},planningPhrases(task,spec));
  var materials=scene.objects?scene.objects.map(function(o){return o==='@chili'?(visit%2?'green_chili':'red_chili'):o}):null;
  var candidates=(materials||Object.keys(phrases)).filter(function(o){return !!phrases[o]}),combos=[];
  candidates.forEach(function(o){spec.destinations.forEach(function(d){combos.push({o:o,d:d,key:o+'|'+d,
    own:context.own.filter(function(e){return e.target===o&&e.dest===d}).length,
    total:context.all.filter(function(e){return e.target===o&&e.dest===d}).length})})});
  if(!combos.length)return null;
  var used=(history.used[scene.id]||[]).filter(function(k){return combos.some(function(c){return c.key===k})});
  var pool=combos.filter(function(c){return used.indexOf(c.key)<0});if(!pool.length){used=[];pool=combos.slice()}
  var different=pool.filter(function(c){return c.key!==history.lastKey});if(different.length)pool=different;
  pool.sort(function(a,b){return a.own-b.own||a.total-b.total});
  var ties=pool.filter(function(c){return c.own===pool[0].own&&c.total===pool[0].total}),c=ties[Math.floor(Math.random()*ties.length)];
  if(!materials){var extras=Object.keys(phrases).filter(function(o){return o!==c.o});materials=[c.o,extras[visit%extras.length],extras[(visit+1)%extras.length]]}
  var plan={task:task,mode:'evaluation',generated:S.data.generated,revision:revision,scene:scene,materials:materials,
    object:c.o,destination:c.d,basis:{private_episodes:context.own.length,public_episodes:context.all.filter(function(e){return e.origin==='public'}).length,total_episodes:context.all.length}};
  plan.title='评测第 '+scene.id+' 组 · '+zh(c.o)+' → '+(task===1?COLOR_ZH[c.d]+'盘':LEVEL_ZH[c.d]);
  var layout=['摆放物品：'+materials.map(zh).join('、')+'。本条只操作'+zh(c.o)+'，其余作为干扰物。'];
  if(task===1){
    plan.plateCount=scene.plates||[2,3][visit%2];
    var others=COLORS.filter(function(color){return color!==c.d});
    plan.plateColors=[c.d];for(var i=0;i<plan.plateCount-1;i++)plan.plateColors.push(others[(visit+i)%others.length]);
    layout.push('摆 '+plan.plateCount+' 个盘子：'+plan.plateColors.map(function(color){return COLOR_ZH[color]+'盘'}).join('、')+'；目标是'+COLOR_ZH[c.d]+'盘。颜色由本次建议补选。');
    var longObjects=materials.filter(function(o){return ['cucumber','red_chili','green_chili','eggplant','banana','carrot'].indexOf(o)>=0});
    if(longObjects.length)layout.push('将'+longObjects.map(zh).join('、')+'横放，保留长条物体之间的形状干扰。');
    if(scene.color)layout.push('所有物品选'+(scene.color==='orange'?'橙色':'红色')+'外观，保留同色干扰；不要用异色物品替代。');
  }else{
    plan.organizerPosition=scene.organizer;
    layout.push('按评测记录的视角，将收纳盒摆在桌面'+scene.organizer+'；本条放入'+LEVEL_ZH[c.d]+'。桌面位置与目标层是两个独立条件。');
    if(scene.split){plan.targetSide=visit%2?'右':'左';layout.push('物品分列桌面最左边和最右边；'+zh(c.o)+'放'+plan.targetSide+'列，其余分到另一列。')}

function psr(task,trials){var R=RUBRIC[task];var s=trials.map(function(tr){var p=0;R.forEach(function(r,i){if(tr[i])p+=r[0]});return p});
  var ok=trials.filter(function(tr){return R.every(function(r,i){return i===R.length-1||tr[i]})}).length;
  return {psr:s.length?s.reduce(function(a,b){return a+b},0)/s.length:null,sr:trials.length?100*ok/trials.length:null,n:trials.length}}

function vSelf(){
  if(!S.state)return '<div class="card">共享记录加载中…</div>';
  var st=S.state.selftest||{},names=Object.keys(st),ck=lsGet("field.selfck","");if(!st[ck])ck=names[names.length-1]||"";
  var cur=st[ck],out=[];

    '<div class="chips" style="margin-top:10px">'+names.map(function(n){return '<button class="chip '+(n===ck?"on":"")+'" data-ck="'+esc(n)+'">'+esc(n)+'</button>'}).join("")+'</div>'+
    '<div style="display:flex;gap:8px;margin:6px 0 10px;align-items:center"><input type="text" id="ckname" placeholder="新 checkpoint 名字，比如 v1-2000步" style="max-width:260px"><button class="act" id="cknew">新建</button></div>');
  if(!cur){out.push('<div class="note">还没有 checkpoint。先在上面新建一个，再开始记。</div></div>');return out.join("")}
  if(![1,2,3].some(function(k){return (cur[k]||[]).length}))out.push('<div style="margin:0 0 8px"><button class="act" id="ckdel">删除 '+esc(ck)+'（还没有记录）</button></div>');
  [1,2,3].forEach(function(t){var R=RUBRIC[t],tr=cur[t]||[];var p=psr(t,tr.map(function(x){return x.s}));
    out.push('<h3>'+TASK_ZH[t]+' · 已记 '+tr.length+' 次 · 过程分 '+(p.psr==null?"—":p.psr.toFixed(1))+' · 成功率 '+(p.sr==null?"—":p.sr.toFixed(0)+"%")+'</h3>');
    out.push('<div class="trial h"><div>#</div>'+R.map(function(r){return '<div title="'+esc(r[1])+'">'+r[0]+' '+esc(r[1])+'</div>'}).join("")+(R.length<6?'<div></div>'.repeat(6-R.length):"")+'<div>得分</div></div>');
    tr.forEach(function(x,i){var sc=0;R.forEach(function(r,j){if(x.s[j])sc+=r[0]});
      out.push('<div class="trial"><div class="num" title="'+esc((x.by||"")+" "+(x.at?bj(x.at):""))+'">'+(i+1)+'</div>'+R.map(function(r,j){return '<label><input type="checkbox" data-tr="'+t+','+i+','+j+'" '+(x.s[j]?"checked":"")+'></label>'}).join("")+(R.length<6?'<div></div>'.repeat(6-R.length):"")+'<div class="num">'+sc+'</div></div>')});
    out.push('<div style="display:flex;gap:6px;margin:4px 0 2px"><button class="act" data-addtr="'+t+'">+ 记一次</button>'+(tr.length?'<button class="act" data-deltr="'+t+'">删最后一次</button>':"")+'</div>')});
  out.push('</div>');
  out.push('<div class="card" style="margin-top:12px"><h2>checkpoint 对比</h2><div class="scroll"><table><thead><tr><th>checkpoint</th><th class="num">任务1</th><th class="num">任务2</th><th class="num">任务3</th><th class="num">估算总分</th><th class="num">次数</th></tr></thead><tbody>'+
    names.map(function(nm){var c=st[nm],P=[1,2,3].map(function(t){return psr(t,(c[t]||[]).map(function(x){return x.s}))}),have=P.filter(function(p){return p.n});
      var tot=have.length?have.reduce(function(a,p){return a+0.7*p.psr+0.3*p.sr},0)/have.length:null;
      return '<tr><td>'+esc(nm)+'</td>'+P.map(function(p){return '<td class="num">'+(p.n?(0.7*p.psr+0.3*p.sr).toFixed(1):"—")+'</td>'}).join("")+'<td class="num"><b>'+(tot==null?"—":tot.toFixed(1))+'</b></td><td class="num">'+P.map(function(p){return p.n}).join("/")+'</td></tr>'}).join("")+
    '</tbody></table></div><div class="note">每个任务只测 5 次左右时，两个 checkpoint 的过程分要差 15 分以上才算真的有差别。</div></div>');
  return out.join("")}

function loadState(){return fetch("/api/field-state",{credentials:"same-origin",cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){S.state=d;if(S.tab==="eval"||S.tab==="selftest")render()}).catch(function(e){setMsg("共享记录取不到（"+e.message+"），稍后再试")})}
function send(op){setMsg("保存中…");return fetch("/api/field-state",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(op)})

  out.push('<div class="grid" style="margin-top:12px">'+[1,2,3].map(function(t){return '<div class="card"><h2>'+TASK_ZH[t]+' · 录制时长分布</h2>'+durHist(t)+'</div>'}).join("")+'</div>');
  out.push('<div class="card" style="margin-top:12px"><h2>每一班采了多少</h2><div class="scroll"><table><thead><tr><th>班次</th><th class="num">任务 1</th><th class="num">任务 2</th><th class="num">任务 3</th><th class="num">合计</th><th class="num">每小时</th></tr></thead><tbody>'+
    ks.slice().reverse().map(function(k){var X=E.filter(function(e){var t=epT(e);return t!=null&&shiftOf(t)===k}),c=[1,2,3].map(function(t){return X.filter(function(e){return e.task===t}).length});
      return '<tr><td>'+esc(shiftName(k))+(k===sh.cur?' <span class="tag">本班</span>':'')+'</td>'+c.map(function(v){return '<td class="num">'+v+'</td>'}).join("")+'<td class="num"><b>'+X.length+'</b></td><td class="num">'+(k<0?"—":(X.length/SHIFT_H).toFixed(1))+'</td></tr>'}).join("")+
    '</tbody></table></div><div class="note">按每条第一次同步进来的时间分班；平台自带采集时间的话用平台的。</div></div>');
  var demos=E.filter(function(e){return e.source!=="rollout"}),rolls=E.filter(function(e){return e.source==="rollout"});
  out.push('<div class="card" style="margin-top:12px"><h2>示范每一步花多久（秒，中位数）</h2><div class="scroll"><table><thead><tr><th>任务</th><th class="num">起步前</th><th class="num">伸手到夹住</th><th class="num">夹住到松开</th><th class="num">松开到归位</th><th class="num">停顿合计</th><th class="num">整条</th></tr></thead><tbody>'+
    [1,2].map(function(t){return '<tr><td>'+esc(TASK_ZH[t])+'</td>'+phaseRow(t,demos.filter(function(e){return e.task===t}))+'</tr>'}).join("")+
    '<tr><td>'+esc(TASK_ZH[3])+'（起步前 / 两只夹爪都夹住 / 停顿 / 整条）</td>'+phaseRow(3,demos.filter(function(e){return e.task===3}))+'<td></td><td></td></tr></tbody></table></div>'+
    '<div class="note">从关节和夹爪数据算：夹爪离开起始开度一半以上算"夹住"；松开后机械臂回到离起点 15% 以内算"归位"。真机夹爪的数值范围拿到现场数据再核对一次。</div></div>');
  function outTable(X){var ks=[];X.forEach(function(e){if(e.out&&ks.indexOf(e.out)<0)ks.push(e.out)});if(!ks.length)return '<div class="small muted">没有最后一帧的结果</div>';
    return '<div class="small">'+[1,2,3].map(function(t){var Y=X.filter(function(e){return e.task===t&&e.out});if(!Y.length)return "";var c=counts([],Y.map(function(e){return e.out}));
      return '<div style="margin:4px 0"><b>任务 '+t+'</b>（'+Y.length+' 条）：'+Object.keys(c).sort(function(a,b){return c[b]-c[a]}).map(function(k){return '<span class="tag '+(k==="ok"?"":"warn")+'">'+esc(OUT_ZH[k]||k)+' '+c[k]+'</span>'}).join("")+'</div>'}).join("")+'</div>'}
  out.push('<div class="card" style="margin-top:12px"><h2>示范最后的结果（比第 0 帧和最后一帧）</h2>'+outTable(demos)+'<div class="note">示范应该都"放对了"。不是的点进"数据质量"看首尾两帧：标错的示范（指令说粉盘、实际放紫盘）对训练伤害最大，建议剔除。</div></div>');
  out.push('<div class="card" style="margin-top:12px"><h2>模型自测 / 推理录像：在哪一步失败</h2>'+(rolls.length?[1,2,3].map(function(t){var Y=rolls.filter(function(e){return e.task===t&&e.out});if(!Y.length)return "";var c=counts([],Y.map(stageOf));
      return '<h3>'+esc(TASK_ZH[t])+' · '+Y.length+' 条</h3>'+bars(c,function(k){return k},{sort:false})}).join(""):'<div class="small muted">还没有。同步时把平台上模型自己跑的数据集标成 rollout（例如 <span class="mono">dev:/路径 rollout 自测</span>），这里就会按任务统计失败发生在哪一步。</div>')+'<div class="note">识别错 → DAgger 重点纠正"伸向错误物体"；抓取失败 → 补抓取姿态多样的示范；放置失败 / 放错 → 补放置和对准；没归位 → 示范结尾一定要归位。</div></div>');
  var C={};E.forEach(function(e){var k=e.collector||"（没填）";(C[k]=C[k]||[]).push(e)});
  out.push('<div class="card" style="margin-top:12px"><h2>按采集人 / 数据集</h2><div class="scroll"><table><thead><tr><th>谁</th><th class="num">任务 1</th><th class="num">任务 2</th><th class="num">任务 3</th><th class="num">录制时长中位数</th><th class="num">有问题的</th></tr></thead><tbody>'+
    Object.keys(C).sort().map(function(k){var X=C[k];return '<tr><td>'+esc(k)+'</td>'+[1,2,3].map(function(t){return '<td class="num">'+X.filter(function(e){return e.task===t}).length+'</td>'}).join("")+'<td class="num">'+(med(X.map(function(e){return e.dur_s}))||0).toFixed(0)+' 秒</td><td class="num">'+X.filter(function(e){return e.q.length}).length+'</td></tr>'}).join("")+
    '</tbody></table></div><div class="note">采集人按同步时给每个数据集填的名字来算。</div></div>');
  out.push('<div class="card" style="margin-top:12px"><h2>录制时长的变化</h2>'+durTrend(E)+'<div class="legend"><span><i style="background:#2f6fdb"></i>任务 1</span><span><i style="background:#1f9d55"></i>任务 2</span><span><i style="background:#b7791f"></i>任务 3</span><span>横轴是同步顺序，纵轴是每条的录制秒数；越往右越新</span></div></div>');
  return out.join("")}

function durTrend(E){var X=E.filter(function(e){return e.dur_s}).slice().sort(function(a,b){return (epT(a)||0)-(epT(b)||0)||a.n-b.n});if(!X.length)return '<div class="small muted">没有数据</div>';
  var W0=640,H0=180,pad=28,ymax=Math.max(10,Math.ceil(Math.max.apply(null,X.map(function(e){return e.dur_s}))/10)*10),col={1:"#2f6fdb",2:"#1f9d55",3:"#b7791f"},s=[];
  for(var g=0;g<=ymax;g+=ymax/4){var y=H0-pad-(H0-2*pad)*g/ymax;s.push('<line x1="'+pad+'" x2="'+(W0-6)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)"/><text x="2" y="'+(y+4)+'" font-size="10" style="fill:var(--muted)">'+Math.round(g)+'</text>')}
  X.forEach(function(e,i){var x=pad+(W0-pad-6)*i/Math.max(1,X.length-1),y=H0-pad-(H0-2*pad)*e.dur_s/ymax;s.push('<circle data-ep="'+e.n+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="'+(col[e.task]||"#999")+'" style="cursor:pointer"><title>#'+e.n+' '+e.dur_s+' 秒</title></circle>')});
  return '<svg viewBox="0 0 '+W0+' '+H0+'" style="width:100%;height:auto">'+s.join("")+'</svg>'}

function render(){
  nav();var m=el("main"),needData={real:1,spatial:1,shift:1,overview:1,coverage:1,analysis:1,quality:1}[S.tab];
  if(needData&&!S.data){m.innerHTML='<div class="card">加载中…</div>';return}
  var v={real:vReal,spatial:vSpatial,shift:vShift,overview:vOverview,coverage:vCoverage,analysis:vAnalysis,quality:vQuality,eval:vEval,selftest:vSelf,rules:vRules}[S.tab]||vReal;
  m.innerHTML=v();
  sourceText();
}
function sourceText(){if(S.data)el("src").textContent="覆盖数据："+(S.data.title||"未命名")+" · 生成于 "+bj(S.data.generated)+"（北京时间）· "+S.data.episodes.length+" 条"}

var dataLoading=false;
function load(){
  if(dataLoading)return;dataLoading=true;
  return fetch("/api/field-data",{credentials:"same-origin",cache:"no-store"}).then(function(r){
    if(r.status===401){location.href="/api/auth/login?next=%2Ffield";throw new Error("login")}
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
      if(!S.data||S.data.generated!==d.generated){S.data=prep(d);render()}else sourceText();
    }).catch(function(e){
    if(String(e.message)!=="login"){
      if(S.data)el("src").textContent='暂时无法检查更新，保留 '+bj(S.data.generated)+' 的数据；稍后自动重试。';
      else el("main").innerHTML='<div class="card">数据暂时取不到（'+esc(e.message)+'），稍后自动重试。</div>';
    }}).finally(function(){dataLoading=false})}

var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h}))S.tab=h;
window.addEventListener("hashchange",function(){var k=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===k})&&k!==S.tab){S.tab=k;el("drawer").classList.remove("on");render()}});
nav();load();loadState();
setInterval(function(){if(document.visibilityState==="visible"&&!el("drawer").classList.contains("on"))load()},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load()});
setInterval(function(){if(document.visibilityState==="visible"&&(S.tab==="eval"||S.tab==="selftest"))loadState()},20000);
</script>
</body>
</html>
